[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-milestone"
version = "0.2.0"
description = "MCP-native git-style version control for agent task trajectories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
agent-milestone-server = "server:main"
agent-milestone-record = "record:main"
agent-milestone-view = "view:main"
agent-milestone-ui = "ui:main"

[tool.setuptools]
py-modules = ["store", "server", "record", "view", "redact", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"test_e2e.py" = ["E402"]
"ui.py" = ["E501"]
